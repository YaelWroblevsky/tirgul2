<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white text-gray-900 p-8 rounded-lg shadow-md">
        <h1 id="welcomeMessage" class="text-3xl font-bold mb-6">
            Welcome
        </h1>

        <h2 class="text-xl font-semibold mb-4">User Management</h2>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border p-3">Username</th>
                        <th class="border p-3">Email</th>
                        <th class="border p-3">Date of Birth</th>
                        <th class="border p-3">Role</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="userManagement.js"></script>
</body>
</html>
